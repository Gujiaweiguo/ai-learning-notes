    entries: 883
    unique_terms: 792
    reuse_without_disambiguation: 91
    worst_case: 项目（跨 5 模块 ×16 处）

relationship:
  semantic_side: 模块×BCM域×Context 映射 v0.1（D2 手工 12 模块全量，D5 程序化覆盖替代）
  implementation_side:
    transactional_coupling:
      - occupancy.CreateTx（合同↔占用，同事务）
      - amendment_receivable_impact（变更→应收重算）
      - ar_rebalance trigger_events（触发重平衡）
    gray_zones: 12 条（见 coverage_report.gray_zones，含 tenant_daily_sales 归属、wf_ 引擎/业务分界）

lifecycle:
  lease:
    source: 代码枚举为准（lease/model.go）
    states: [draft, pending_approval, pending_termination, active, rejected, terminated, voided, closed]
    approval_codes: [lease-approval, lease-change]
  condition_approval:
    states: [pending_approval, ...]
    audit: condition_approval_lifecycle_audit
  amendment:
    form: 运行时可编辑 9 类矩阵（amendmentmatrix 包，键=lease.AmendmentType）
    snapshot_gap: 矩阵变更无版本快照（D4 缺口④）

rule:
  registry: effect-registry v1.0（2026-07-26 冻结）
  frozen_types:
    - state-transition-effect
    - occupancy-effect
    - financial-effect
    - lead-conversion-effect
    - maintenance-effect
  evaluated_not_registered:
    service-effect: 无独立结果类语义，由 state-transition/maintenance/financial/occupancy 覆盖（代码侧 13 Context 仅 3 表反向验证）
  implementation_map:
    state-transition-effect: [lease 8 态机, conditionapproval]
    occupancy-effect: [occupancy 包 CreateTx + ReserveRejectsActiveOccupancy]
    financial-effect: [billing, collections, arrebalance]  # 多对多映射
    lead-conversion-effect: [opportunity_status_history]   # 断言未逐条核
    maintenance-effect: [repair_work_orders, material_* 族]

