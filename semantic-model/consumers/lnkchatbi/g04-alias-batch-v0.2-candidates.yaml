# ---- ② 通用词门槛设计 v0.1（P2/P3 类：命中≠可答的误触治理）----
# 证据：P2「各项目工单完成率如何？」/ P3「当前项目租赁结构指标怎么样？」——经『项目』（dim_project 正名）
# 命中术语组计入 battery 覆盖率，但问句真实对象分别是 工单（mv_ops_daily 域）/ 租赁结构（mv_leasing_structure），
# 注入 dim_project 术语组无助于作答 = 命中≠可答。两次电池复现。
generic_word_gate:
  design: "检索命中 ≠ 注入。三规则（v0.1 设计稿，W17 批次评审定稿）："
  rules:
    - id: GW-1 别名分级
      what: "术语组别名标记 tier：strong（专名/行业词：铺位、合同、应收）vs weak（通用词：项目、商户、门店）。weak 别名入 pack 须过 GW-2/GW-3。"
    - id: GW-2 指标共现门槛
      what: "weak 别名命中的组，仅当问句词元与该组 description/示例问句有第二交集（指标词/动词）时升级注入。P2『完成率』∉ dim_project 组 → 不注入；P3『租赁结构』∉ dim_project 组 → 不注入（正确目标组经专名命中）。"
    - id: GW-3 消歧注记
      what: "weak 别名在 terminology.json 的 description 前缀『通用词：仅当问句主对象为 <维度> 时适用』——注入 prompt 的唯一通道是 description，消歧提示必须走同一通道（与 W16-D3 值域口径同源原则）。"
  acceptance_w17:
    - "V2 命中：batch 2 别名注入后 V2 术语命中 0→1（inferred 候选须先补电池题）"
    - "P2/P3 误注入消失：『项目』组不再作为唯一命中被注入（判据=注入组与问句指标词有交集）"
    - "Q 组 21 题无回归 + S 组守恒（既有命中面不缩水）"

